<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交 Issue - RhythmGameQuery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
        }
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px;
            width: 100%;
            max-width: 600px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
        
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #667eea;
            font-size: 1.05rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .success-box {
            text-align: center;
            padding: 30px 0;
        }
        .success-icon { font-size: 4rem; margin-bottom: 20px; }
        .success-box h2 { color: #2e7d32; margin-bottom: 15px; }
        .success-box p { color: #666; margin-bottom: 30px; }
        
        .site-footer {
            background: rgba(0, 0, 0, 0.3);
            color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            text-align: center;
            width: 100%;
            margin-top: auto;
        }
        .footer-copyright { font-size: 0.85rem; opacity: 0.6; }
        
        @media (max-width: 600px) {
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="container">
            {% if success %}
                <div class="success-box">
                    <div class="success-icon">✅</div>
                    <h2>提交成功！</h2>
                    <p>感谢你的反馈，我们会尽快处理。</p>
                    <a href="/" class="submit-btn" style="text-decoration:none;display:inline-block;width:auto;padding:15px 40px;">返回首页</a>
                </div>
            {% else %}
                <a href="/" class="back-link">← 返回首页</a>
                
                <div class="header">
                    <h1>🐛 提交 Issue</h1>
                    <p>有任何问题或建议？请告诉我们</p>
                </div>

                {% if error %}
                    <div style="background:#fff0f0;color:#d32f2f;padding:15px;border-radius:8px;margin-bottom:20px;">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST">
                    <div class="form-group">
                        <label>称呼 *</label>
                        <input type="text" name="name" placeholder="请输入你的称呼" required>
                    </div>
                    <div class="form-group">
                        <label>联系方式（选填）</label>
                        <input type="text" name="contact" placeholder="邮箱 / QQ / 微信等">
                    </div>
                    <div class="form-group">
                        <label>内容 *</label>
                        <textarea name="content" placeholder="请详细描述你的问题或建议..." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">提交 Issue</button>
                </form>
            {% endif %}
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-copyright">
            © 2026 RhythmGameQuery. All rights reserved.
        </div>
    </footer>
</body>
</html>
