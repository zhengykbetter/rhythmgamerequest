<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - 施工中</title>
    <style>
        /* 这里也可以用同样的 Flex 布局保持 Footer 一致，或者简单居中 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 60px 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
        }
        .icon { font-size: 5rem; margin-bottom: 20px; animation: bounce 2s infinite; }
        h1 { font-size: 2rem; margin-bottom: 15px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        p { font-size: 1.1rem; opacity: 0.9; margin-bottom: 30px; line-height: 1.6; }
        .btn {
            background: white; color: #667eea; border: none; padding: 15px 40px;
            font-size: 1.1rem; border-radius: 12px; cursor: pointer;
            font-weight: 600; text-decoration: none; display: inline-block;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>{{ page_title }}</h1>
        <p>这个页面正在紧张施工中...<br>敬请期待！</p>
        <a href="/" class="btn">← 返回首页</a>
    </div>
</body>
</html>
